
name: Actualitzar dades Horta 08031

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-dashboard-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recollir dades
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
        run: python src/generate_data.py

      - name: Publicar JSON actualitzat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/dashboard.json

          if git diff --cached --quiet; then
            echo "No hi ha canvis a publicar"
          else
            git commit -m "Actualitza dades del dashboard"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
