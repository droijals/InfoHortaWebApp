name: Publicar webapp Horta 08031

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
